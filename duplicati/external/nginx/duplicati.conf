# Needed to support websocket connections
# See: https://nginx.org/en/docs/http/websocket.html
# Instead of "close" as stated in the above link we send an empty value.
# Else all keepalive connections will not work.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# HTTPS server
server {
    listen       443 ssl proxy_protocol;
    listen  [::]:443 ssl proxy_protocol;

    http2 on;
    server_name  duplicati.example.internal;
    server_tokens off;

    set_real_ip_from 172.18.0.1;
    real_ip_header proxy_protocol;
    real_ip_recursive on;

    ssl_certificate      /ca_certs/server.crt;
    ssl_certificate_key  /private/server.key;

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers  on;
    ssl_session_tickets off;

    # Gzip compression — ~75% bandwidth savings for text assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Body size limit
    client_max_body_size 10M;

    # HSTS — tell browser to always use HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options     "nosniff"                                always;
    add_header X-Frame-Options            "SAMEORIGIN"                             always;
    add_header X-XSS-Protection           "1; mode=block"                          always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"        always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:" always;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # If you use Cloudflare proxying, replace $remote_addr with $http_cf_connecting_ip
    # See https://developers.cloudflare.com/support/troubleshooting/restoring-visitor-ips/restoring-original-visitor-ips/#nginx-1
    # alternatively use ngx_http_realip_module
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $proxy_domain "duplicati";
    resolver 127.0.0.11 valid=30s;

    location / {
        proxy_pass http://$proxy_domain:8200;
    }

    location /notifications {
        proxy_pass http://$proxy_domain:8200;
        proxy_read_timeout 3600s;
    }
}
